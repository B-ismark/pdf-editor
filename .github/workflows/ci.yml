name: CI

# Build, type-check, and run the Playwright end-to-end tests on PRs into main
# and on main itself. Deployment is handled separately by deploy.yml on pushes
# to main.
#
# `push` is deliberately limited to main. It used to run on every branch, and
# since a PR branch lives in this repo, a single push to an open PR matched both
# `push` and `pull_request` and ran the whole suite twice against the identical
# commit — two Playwright browser installs, two full e2e runs, and two chances
# for that download step to stall (it did, and blocked a merge on a run that
# carried no information the passing one hadn't already given).
#
# The trade-off: a branch with no PR open gets no CI. That's the intended
# workflow here anyway — work goes to a branch, a PR opens, and it squash-merges
# into main — and the first push after opening the PR covers it.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Must run before the build so the OCR assets are bundled into dist/ and
      # the OCR spec exercises the feature instead of skipping itself.
      - name: Bundle on-device OCR assets
        run: npm run setup-ocr

      - name: Build (also type-checks)
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
