<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      No maximum-scale / user-scalable lock: browser + OS zoom (and Dynamic
      Type / font scaling) must stay available for low-vision users. The
      canvas owns its own gestures only where it needs to, via a scoped
      `touch-action` on the scroll surface — not a global zoom lock.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <!-- Match the browser chrome to the theme actually in use. -->
    <meta name="theme-color" content="#fef7ff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141218" media="(prefers-color-scheme: dark)" />
    <title>PDF Editor — edit PDFs in your browser</title>
    <meta
      name="description"
      content="Edit PDF text, annotate, sign, redact and reorganise pages entirely in your browser. No uploads, no accounts — the file never leaves your device."
    />
    <!--
      No web fonts. A CDN stylesheet would send every visitor's IP, User-Agent
      and Referer to a third party on page load, which flatly contradicts the
      "nothing leaves your device" promise this app is built on — and would be
      blocked in the offline/locked-down environments it should still work in.
      The type scale runs on the system font stack (see theme.css).
    -->
  </head>
  <body>
    <script>
      // Resolve the saved theme preference before first paint (no flash).
      (function () {
        try {
          var m = localStorage.getItem("theme") || "system";
          var dark =
            m === "dark" ||
            (m === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute(
            "data-theme",
            dark ? "dark" : "light",
          );
        } catch (e) {
          /* localStorage blocked — fall back to light. */
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
